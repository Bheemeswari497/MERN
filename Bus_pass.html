<!DOCTYPE html>
<html>
<head>
    <title>Student Bus Pass Form</title>
</head>
<body>

    <h2 style="text-align: center;">Student Bus Pass Application Form</h2>

    <form>
        <table border="0" cellpadding="10" align="center">

            <tr>
                <td><label>Student Name</label></td>
                <td><input type="text" name="student_name"></td>
            </tr>

            <tr>
                <td><label>Father / Mother Name</label></td>
                <td><input type="text" name="parent_name"></td>
            </tr>

            <tr>
                <td><label>Student ID / Roll No</label></td>
                <td><input type="text" name="roll_no"></td>
            </tr>

            <tr>
                <td><label>Class / Grade</label></td>
                <td><input type="text" name="class"></td>
            </tr>

            <tr>
                <td><label>Date of Birth</label></td>
                <td><input type="date" name="dob"></td>
            </tr>

            <tr>
                <td><label>Mobile Number</label></td>
                <td><input type="text" name="mobile"></td>
            </tr>

            <tr>
                <td><label>Address</label></td>
                <td><textarea name="address" rows="3"></textarea></td>
            </tr>

            <tr>
                <td><label>Bus Route</label></td>
                <td>
                    <select name="route">
                        <option>-- Select Route --</option>
                        <option>Drakshram</option>
                        <option>Ramchandrapuram</option>
                        <option>Gangavaram</option>
                        <option>Dangeru</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label>Pickup Point</label></td>
                <td><input type="text" name="pickup"></td>
            </tr>

            <tr>
                <td><label>Drop Point</label></td>
                <td><input type="text" name="drop"></td>
            </tr>

            <tr>
                <td><label>Upload Photo</label></td>
                <td><input type="file" name="photo"></td>
            </tr>

            <tr>
                <td>
                    <label>
                        <input type="checkbox"> I agree to the terms
                    </label>
                </td>
                <td></td>
            </tr>

            <tr>
                <td><input type="reset" value="Clear"></td>
                <td><input type="submit" value="Submit"></td>
            </tr>

        </table>
    </form>

</body>
</html>
